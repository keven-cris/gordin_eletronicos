    <h1 style="position: relative; display: flex; justify-content: center;">Página de Cadastro</h1>
    <div class="divcadrasto">
        <div class="divdentro">
            <H2 style="position: absolute; top: -130px;">Cadastro</H2>
            <form id="formula" action="pagina1.html" method="get">
                <label for="nome" style="font-size: 17px;">Nome do Usuario</label> <br>
                <input name="nome" id="nome" type="text" placeholder="Enter Username" style=" width: 200px; height: 20px;" required>
                <br>
                <label for="email" style="font-size: 17px;">E-mail</label>
                <br>
                <input name="email" id="email" type="email" placeholder="E.X.john@gmail.com" style=" width: 200px; height: 20px;" required>
                <br>
                <label for="senha" style="font-size: 17px;">Senha</label>
                <br>
                <input name="senha" id="senha" type="password" placeholder="insira sua senha" style=" width: 200px; height: 20px;" required>
                <br>
                <a href="pagina4.html" style="position: relative; left: 50%; right: 50%;"><p>Fazer login</p></a>
                <br>
                <button type="submit" id="registrar" style="border-radius: 20px; background-color: rgb(13, 121, 194);"><p>Registra-se</p></button>
            </form>
        </div>
    </div>
    <footer class="rodape">

    <script>
        const formulario = document.getElementById("formula")
        formulario.addEventListener('submit', function(event) {
            event.preventDefault();
            const nome = document.getElementById("nome").value;
            const email = document.getElementById("email").value;
            const senha = document.getElementById("senha").value;
            localStorage.setItem('nomepegado', nome);
            localStorage.setItem('emailpegado', email);
            localStorage.setItem('senhapegado', senha);

            window.location.href = "pagina1.html";
        })
